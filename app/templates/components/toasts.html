<div class="fixed right-4 top-20 z-50 grid gap-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="toast rounded-md border border-rajGold/30 bg-white px-4 py-3 text-sm text-rajInk shadow-luxury">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}
</div>
