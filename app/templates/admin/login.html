<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | RajKamal Jewellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { rajGold: "#D4AF37", rajMaroon: "#5C1A1B", rajWine: "#2A0709", rajCream: "#FFF8EA" }, fontFamily: { display: ["Cormorant Garamond", "Georgia", "serif"], body: ["Poppins", "ui-sans-serif", "system-ui"] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="grid min-h-screen place-items-center bg-rajWine px-4 font-body">
    <img src="{{ url_for('static', filename='uploads/hero-bridal-premium.jpg') }}" alt="" class="fixed inset-0 h-full w-full object-cover opacity-28">
    <div class="fixed inset-0 bg-gradient-to-r from-rajWine via-rajMaroon/78 to-rajWine"></div>
    <form method="post" class="relative w-full max-w-md rounded-lg border border-rajGold/30 bg-white/95 p-8 shadow-2xl">
        <p class="section-kicker">Secure Admin</p>
        <h1 class="mt-3 font-display text-4xl font-bold text-rajMaroon">RajKamal Jewellers</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="mt-4 rounded-md bg-rajCream p-3 text-sm">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <div class="mt-6 grid gap-4">
            <input name="email" type="email" required placeholder="Admin email" class="form-input">
            <input name="password" type="password" required placeholder="Password" class="form-input">
            <button class="btn-maroon">Login</button>
        </div>
    </form>
</body>
</html>
