<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | RajKamal Jewellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { rajGold: "#D4AF37", rajMaroon: "#5A0F18", rajCream: "#FFF8EA" } } } }</script>
</head>
<body class="grid min-h-screen place-items-center bg-[#FFF8EA] px-4">
    <form method="post" class="w-full max-w-md rounded-lg border border-[#D4AF37]/30 bg-white p-8 shadow-2xl">
        <p class="text-sm font-bold uppercase tracking-[.3em] text-[#D4AF37]">Secure Admin</p>
        <h1 class="mt-3 text-3xl font-bold text-[#5A0F18]">RajKamal Jewellers</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="mt-4 rounded-md bg-[#FFF8EA] p-3 text-sm">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <div class="mt-6 grid gap-4">
            <input name="email" type="email" required placeholder="Admin email" class="rounded-full border border-[#D4AF37]/40 px-5 py-3 outline-none focus:border-[#D4AF37]">
            <input name="password" type="password" required placeholder="Password" class="rounded-full border border-[#D4AF37]/40 px-5 py-3 outline-none focus:border-[#D4AF37]">
            <button class="rounded-full bg-[#5A0F18] px-6 py-3 font-semibold text-white">Login</button>
        </div>
    </form>
</body>
</html>
