<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Admin | RajKamal Jewellers{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { rajGold: "#D4AF37", rajMaroon: "#5A0F18", rajCream: "#FFF8EA" }, fontFamily: { display: ["Georgia", "serif"] } } } }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-rajCream text-[#211411]">
    <div class="min-h-screen md:flex">
        <aside class="bg-rajMaroon p-5 text-white md:min-h-screen md:w-72">
            <a href="{{ url_for('admin.dashboard') }}" class="font-display text-2xl font-bold text-rajGold">RajKamal Admin</a>
            <nav class="mt-8 grid gap-2 text-sm font-semibold">
                <a class="admin-link" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
                <a class="admin-link" href="{{ url_for('admin.products') }}">Products</a>
                <a class="admin-link" href="{{ url_for('admin.banners') }}">Banners</a>
                <a class="admin-link" href="{{ url_for('admin.orders') }}">Orders & Enquiries</a>
                <a class="admin-link" href="{{ url_for('public.home') }}">View Website</a>
                <a class="admin-link" href="{{ url_for('admin.logout') }}">Logout</a>
            </nav>
        </aside>
        <main class="flex-1 p-4 md:p-8">
            {% include "components/toasts.html" %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
