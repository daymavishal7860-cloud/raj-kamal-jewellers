{% extends "admin/base.html" %}
{% block title %}Banners | RajKamal Admin{% endblock %}
{% block content %}
<p class="section-kicker">Homepage</p>
<h1 class="section-title">Banner Management</h1>
<form method="post" enctype="multipart/form-data" class="mt-8 grid gap-4 rounded-lg border border-rajGold/20 bg-white p-6 shadow-sm md:grid-cols-2">
    <input name="title" required placeholder="Banner title" class="form-input">
    <input name="subtitle" placeholder="Subtitle" class="form-input">
    <input name="image_url" placeholder="Image URL or upload below" class="form-input md:col-span-2">
    <input name="image" type="file" accept="image/*" class="form-input">
    <input name="order" type="number" value="1" class="form-input">
    <label class="flex items-center gap-3 rounded-full border border-rajGold/30 px-5 py-3"><input type="checkbox" name="active" checked> Active</label>
    <button class="rounded-full bg-rajMaroon px-7 py-3 font-semibold text-white md:w-fit">Add Banner</button>
</form>
<div class="mt-8 grid gap-5 md:grid-cols-2">
    {% for banner in banners %}
        <article class="overflow-hidden rounded-lg bg-white shadow-sm">
            <img src="{{ banner.image if banner.image.startswith('http') else url_for('static', filename=banner.image) }}" alt="{{ banner.title }}" class="h-56 w-full object-cover">
            <div class="p-5">
                <h2 class="font-display text-2xl font-bold text-rajMaroon">{{ banner.title }}</h2>
                <p class="mt-2 text-sm text-black/60">{{ banner.subtitle }}</p>
                <form method="post" action="{{ url_for('admin.banner_delete', banner_id=banner._id) }}" class="mt-4">
                    <button class="rounded-full border border-red-300 px-4 py-2 text-sm text-red-700">Delete</button>
                </form>
            </div>
        </article>
    {% else %}
        <p class="text-black/50">No banners yet.</p>
    {% endfor %}
</div>
{% endblock %}
