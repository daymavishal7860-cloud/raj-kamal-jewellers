<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="RajKamal Jewellers Jalna - premium Indian bridal jewellery, hallmarked gold, temple jewellery, wedding collections, and heritage craftsmanship since 1978.">
    <meta property="og:title" content="{% block og_title %}RajKamal Jewellers | Indian Bridal Jewellery{% endblock %}">
    <meta property="og:description" content="A cinematic Indian bridal jewellery showroom experience from RajKamal Jewellers, Jalna.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ url_for('static', filename='uploads/hero-bridal-premium.jpg', _external=True) }}">
    <title>{% block title %}RajKamal Jewellers{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rajGold: "#D8B85A",
                        rajMaroon: "#681719",
                        rajWine: "#230506",
                        rajCream: "#FFF7E6",
                        rajIvory: "#FFFFF7",
                        rajInk: "#1E1715"
                    },
                    fontFamily: {
                        display: ["Cormorant Garamond", "Playfair Display", "Georgia", "serif"],
                        body: ["Poppins", "Inter", "ui-sans-serif", "system-ui"]
                    },
                    boxShadow: {
                        luxury: "0 24px 70px rgba(92,26,27,.2)",
                        gold: "0 18px 45px rgba(212,175,55,.16)"
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-rajCream text-rajInk font-body antialiased">
    {% include "components/navbar.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% include "components/footer.html" %}
    {% include "components/toasts.html" %}
    <div class="fixed inset-x-3 bottom-3 z-50 grid grid-cols-2 gap-2 md:hidden">
        <a href="{{ url_for('public.products') }}" class="mobile-cta">Collections</a>
        <a href="https://wa.me/918956715719?text=Namaste%20RajKamal%20Jewellers%2C%20I%20would%20like%20to%20enquire%20about%20bridal%20jewellery." class="mobile-cta mobile-cta-gold">WhatsApp</a>
    </div>
    <a href="https://wa.me/918956715719?text=Namaste%20RajKamal%20Jewellers%2C%20I%20would%20like%20to%20enquire%20about%20jewellery." class="whatsapp-float hidden md:grid" aria-label="Chat on WhatsApp">
        WA
    </a>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
